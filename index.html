<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aala AI - KDP Book Architect</title>
    <script>
      // Fix for "Cannot set property fetch of #<Window> which has only a getter"
      // Some libraries try to override fetch, but in some iframe environments it's read-only.
      (function() {
        try {
          const originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return originalFetch; },
            set: function(v) { 
              console.warn('Something tried to override fetch:', v);
            },
            configurable: true,
            enumerable: true
          });
          
          // JSON.parse safety wrapper to debug "undefined" is not valid JSON
          const originalParse = JSON.parse;
          JSON.parse = function(text, reviver) {
            if (text === undefined || text === "undefined") {
              console.warn("JSON.parse called with undefined! Check your environment variables or local storage.");
              return undefined;
            }
            try {
              return originalParse.call(JSON, text, reviver);
            } catch (e) {
              if (text && text.length > 100) {
                console.error("JSON.parse failed for long string:", text.substring(0, 100) + "...");
              } else {
                console.error("JSON.parse failed for:", text);
              }
              throw e;
            }
          };

          // Define global if it's missing (needed by some older libraries)
          if (typeof global === 'undefined') {
            window.global = window;
          }

          console.log("Environment patches initialized");
        } catch (e) {
          console.warn('Could not initialize environment patches:', e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
